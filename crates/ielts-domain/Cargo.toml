[package]
name = "ielts-domain"
version = "0.1.0"
edition = "2021"
description = "IELTS Practice domain contracts, DTOs, and legacy adapters for the Rust + Tauri rewrite"
license = "UNLICENSED"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
ts-rs = { version = "10", optional = true, features = ["serde-compat"] }

[features]
default = []
ts-export = ["ts-rs"]

[dev-dependencies]
proptest = "1"
serde_json = "1"
