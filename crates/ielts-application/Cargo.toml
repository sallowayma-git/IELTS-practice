[package]
name = "ielts-application"
version = "0.1.0"
edition = "2021"
description = "Application use cases for IELTS Practice"
publish = false

[features]
default = ["learning-event-ledger-v1", "learning-observation-v1", "memory-core-v1", "learner-model-v1"]
learning-event-ledger-v1 = ["ielts-db/learning-event-ledger-v1"]
learning-observation-v1 = [
  "learning-event-ledger-v1",
  "ielts-db/learning-observation-v1",
]
memory-core-v1 = ["learning-observation-v1", "ielts-db/memory-core-v1"]
learner-model-v1 = [
  "learning-observation-v1",
  "ielts-db/learner-model-v1",
]

[dependencies]
async-trait = "0.1"
ielts-domain = { path = "../ielts-domain" }
ielts-db = { path = "../ielts-db", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
rusqlite = "0.32"
hex = "0.4"
