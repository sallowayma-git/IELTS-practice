  <path d="M260 250C330 265 385 274 450 274C515 274 570 265 640 250M220 310C300 325 365 334 450 334C535 334 600 325 680 310M180 370C285 382 350 390 450 390C550 390 615 382 720 370" fill="none" stroke="#80613f" stroke-width="7" stroke-linecap="round"/>
