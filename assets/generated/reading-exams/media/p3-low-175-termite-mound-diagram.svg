    <circle cx="226" cy="307" r="22" fill="#fff" stroke="#594735" stroke-width="3"/><text x="226" y="315" text-anchor="middle">34</text>
    <circle cx="674" cy="307" r="22" fill="#fff" stroke="#594735" stroke-width="3"/><text x="674" y="315" text-anchor="middle">36</text>
    <circle cx="450" cy="115" r="22" fill="#fff" stroke="#594735" stroke-width="3"/><text x="450" y="123" text-anchor="middle">37</text>
