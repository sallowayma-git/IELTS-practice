<!doctype html>
<html lang="zh-CN" data-listening-wrapper="true">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>IELTS Listening Practice</title>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #f6f7fb;
        }

        #listening-wrapper-root {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        #listening-practice-frame,
        .listening-suite-frame {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
            background: #f6f7fb;
            flex: 1;
            min-height: 0;
        }

        .listening-suite-frame[hidden] { display: none !important; }
        .listening-suite-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 16px; background: #fff; border-bottom: 1px solid #d7dde5; font: 14px system-ui, sans-serif; }
        .listening-suite-toolbar button { padding: 6px 12px; border: 1px solid #cbd5e1; border-radius: 6px; background: #fff; color: #0f172a; cursor: pointer; }
        .listening-suite-toolbar button[aria-current="step"] { background: #2563eb; border-color: #2563eb; color: #fff; }
        .listening-suite-toolbar button:disabled { opacity: .55; cursor: default; }
        .listening-suite-message { flex: 1 1 180px; color: #475569; }

        .listening-wrapper-status {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            background: #f6f7fb;
            color: #1f2937;
            font: 600 14px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            z-index: 2;
        }

        .listening-wrapper-status[hidden] {
            display: none;
        }
    </style>
</head>
<body>
    <div id="listening-wrapper-root" data-exam-id="" data-source-url="" data-base-href="">
        <iframe id="listening-practice-frame" title="IELTS Listening Practice"></iframe>
        <div id="listening-wrapper-status" class="listening-wrapper-status">Loading listening practice...</div>
    </div>
    <script src="../../../js/bundles/listening-wrapper.bundle.js" defer></script>
</body>
</html>
