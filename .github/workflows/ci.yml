name: CI

on:
  pull_request:
    branches: [opensource]
  push:
    branches: [opensource]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Playwright (Chromium)
        run: |
          npm ci --prefix developer
          python -m pip install --upgrade pip
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium

      - name: Check JS bundle drift
        # The committed files under js/bundles/ must match what the build script
        # produces from the committed sources. If this step fails, a source file
        # was edited without rebuilding its bundle (run `node scripts/build-bundles.mjs`).
        run: node scripts/build-bundles.mjs --check

      - name: Run JavaScript unit and regression tests
        run: npm test --prefix developer

      - name: Run Python unit tests
        run: python -m unittest discover -s developer/tests/py -p "test_*.py"

      - name: Check reading data integrity
        run: python developer/tests/ci/check_reading_data_integrity.py

      - name: Run unified E2E suite (file:// capable)
        # Leave time for retained diagnostics before the job's 30-minute limit.
        timeout-minutes: 15
        run: python developer/tests/e2e/e2e_runner.py

      - name: Upload E2E diagnostics
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics-${{ github.run_attempt }}
          path: |
            developer/tests/e2e/reports/**/*.json
            developer/tests/e2e/reports/**/*.log
            developer/tests/e2e/reports/**/*.png
          if-no-files-found: ignore
          retention-days: 14
