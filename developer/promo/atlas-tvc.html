<title>IELTS Atlas TVC</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@700;900&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400;1,6..72,500&display=swap">
<style>
/* Layout: a 1920×1080 TVC stage scaled to the column, transport + soundtrack loader under it,
   then the shot list. The film is a single dark look on purpose. */
:root {
  --void: #050505;
  --ink: #F4F1EA;
  --mute: #8F897E;
  --ember: #E8743F;
  --panel: #12110F;
  --rule: rgba(244, 241, 234, 0.14);
  --f-sans: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --f-serif: "Noto Serif SC", "Songti SC", serif;
  --f-en: "Newsreader", "Iowan Old Style", Georgia, serif;
  color-scheme: dark;
}
html, body { background: var(--void); color: var(--ink); }
body { font-family: var(--f-sans); font-size: 15px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 56px; }
.page { max-width: 1280px; margin: 0 auto; display: grid; gap: 20px; }
.masthead { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; }
.masthead h1 { margin: 0; font-size: 22px; font-weight: 700; }
.masthead h1 span { color: var(--ember); }
.masthead p { margin: 0; color: var(--mute); font-size: 14px; }
.viewport { position: relative; width: 100%; max-width: 100%; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 14px; background: #000; box-shadow: 0 0 0 1px var(--rule); cursor: pointer; }
.viewport:fullscreen { border-radius: 0; box-shadow: none; }
.transport { display: grid; grid-template-columns: auto auto 1fr auto auto; align-items: center; gap: 12px; }
.btn { appearance: none; border: 1px solid var(--rule); background: var(--panel); color: var(--ink); height: 40px; min-width: 40px; padding: 0 14px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font: 500 14px var(--f-sans); cursor: pointer; }
.btn:hover { border-color: rgba(244, 241, 234, 0.32); }
.btn:focus-visible, input:focus-visible, .chip:focus-visible, label.btn:focus-within { outline: 2px solid var(--ember); outline-offset: 2px; }
.btn svg { width: 16px; height: 16px; fill: currentColor; }
.time { font-variant-numeric: tabular-nums; color: var(--mute); font-size: 13px; white-space: nowrap; }
input[type=range] { width: 100%; min-width: 0; accent-color: var(--ember); }
.sound { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 14px 16px; border: 1px solid var(--rule); border-radius: 14px; background: var(--panel); }
.sound input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }
.sound p { margin: 0; color: var(--mute); font-size: 13.5px; line-height: 1.6; flex: 1 1 280px; min-width: 0; }
.sound p b { color: var(--ink); font-weight: 500; }
.notes { background: var(--panel); border: 1px solid var(--rule); border-radius: 14px; padding: 22px 24px; }
.notes h2 { margin: 0 0 4px; font-size: 17px; }
.notes .lede { margin: 0 0 14px; color: var(--mute); font-size: 14px; line-height: 1.6; }
.shots { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 0 24px; }
.shots li { min-width: 0; display: grid; grid-template-columns: 52px 1fr; gap: 10px; padding: 10px 0; border-top: 1px solid var(--rule); cursor: pointer; }
.shots li[aria-current="true"] .tc { color: var(--ink); }
.shots li[aria-current="true"] strong { color: var(--ember); }
.shots .tc { font-variant-numeric: tabular-nums; color: var(--ember); font-size: 12.5px; padding-top: 2px; }
.shots strong { display: block; font-size: 14px; font-weight: 700; }
.shots span { color: var(--mute); font-size: 13px; line-height: 1.55; }
.shots em { font-family: var(--f-en); font-style: italic; color: #F6A47E; }
@media (max-width: 820px) {
  .transport { grid-template-columns: auto auto 1fr; }
  .transport .time { grid-column: 1 / -1; }
  .transport .fs { display: none; }
}

/* ───────── stage ───────── */
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; background: var(--void); color: var(--ink); font-family: var(--f-sans); -webkit-font-smoothing: antialiased; }
#stage * { box-sizing: border-box; }
.shot { position: absolute; inset: 0; overflow: hidden; display: none; }
.abs { position: absolute; }
.fill { position: absolute; inset: 0; }
.ch { display: inline-block; will-change: transform, opacity; }
.chi { will-change: opacity; }
.lyric { font: italic 500 120px/1.05 var(--f-en); letter-spacing: -0.02em; }
.super { font-size: 64px; font-weight: 900; letter-spacing: -0.01em; }
.eyebrow { font: 500 24px var(--f-sans); letter-spacing: 0.24em; text-transform: uppercase; }
.center-x { left: 0; right: 0; text-align: center; }
.mascot svg, .msc { display: block; width: 100%; height: 100%; overflow: visible; }

/* laptop (CSS 3D) */
.lap { position: absolute; inset: 0; perspective: 2600px; perspective-origin: 50% 42%; }
.lap-rig { position: absolute; left: 50%; top: 58%; width: 0; height: 0; transform-style: preserve-3d; }
.lap-lid { position: absolute; left: -600px; top: -780px; width: 1200px; height: 780px; transform-origin: 50% 100%; transform-style: preserve-3d; }
.lid-front, .lid-back { position: absolute; inset: 0; border-radius: 36px; backface-visibility: hidden; }
.lid-front { background: #0A0A0B; padding: 22px 22px 34px; box-shadow: inset 0 0 0 2px #2C2C2F, inset 0 0 0 4px #0A0A0B, inset 0 0 0 5px #3A3A3E; }
.bezel { position: relative; width: 100%; height: 100%; border-radius: 16px 16px 6px 6px; overflow: hidden; background: #000; }
.screen { position: absolute; left: 0; top: 0; width: 1156px; height: 724px; }
.glare { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(115deg, rgba(255,255,255,0) 35%, rgba(255,255,255,0.10) 48%, rgba(255,255,255,0) 60%); mix-blend-mode: screen; }
.dim { position: absolute; inset: 0; background: #000; pointer-events: none; }
.lid-back { transform: rotateY(180deg); background: linear-gradient(160deg, #47474B, #26262A 55%, #38383C); box-shadow: inset 0 0 0 2px rgba(255,255,255,0.08); }
.lid-back i { position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; background: var(--ember); box-shadow: 0 0 40px rgba(232,116,63,0.6); }
.lap-deck { position: absolute; left: -600px; top: 0; width: 1200px; height: 840px; transform-origin: 50% 0; transform: rotateX(90deg); border-radius: 36px 36px 46px 46px; background: linear-gradient(#3A3A3E, #2A2A2E 30%, #333337); box-shadow: inset 0 0 0 2px rgba(255,255,255,0.07); }
.kbd { position: absolute; left: 120px; top: 74px; width: 960px; height: 390px; border-radius: 12px; background-color: #151517;
  background-image: repeating-linear-gradient(90deg, transparent 0 62px, #2E2E32 62px 68px), repeating-linear-gradient(0deg, transparent 0 59px, #2E2E32 59px 65px); }
.pad { position: absolute; left: 350px; top: 500px; width: 500px; height: 300px; border-radius: 22px; background: #38383C; box-shadow: inset 0 0 0 2px rgba(255,255,255,0.08); }
.lap-hinge { position: absolute; left: -564px; top: -13px; width: 1128px; height: 26px; border-radius: 13px; background: linear-gradient(#1A1A1C, #4A4A4F 45%, #1E1E21); }
.lap-shadow { position: absolute; left: 50%; width: 1500px; height: 180px; margin-left: -750px; border-radius: 50%; background: radial-gradient(closest-side, rgba(0,0,0,0.55), transparent); }

/* app UI inside the screen (Warm Paper) */
.app { position: absolute; inset: 0; background: #F4F1EA; color: #22201C; font-family: var(--f-sans); }
.app-nav { height: 58px; display: flex; align-items: center; gap: 26px; padding: 0 30px; border-bottom: 1px solid rgba(34,32,28,0.12); font-size: 16px; color: #4B4741; background: #F7F5EF; }
.app-nav b { font: 600 22px var(--f-en); color: #161512; margin-right: 18px; }
.app-nav .on { color: #161512; font-weight: 700; position: relative; }
.app-nav .on::after { content: ""; position: absolute; left: 0; right: 0; bottom: -19px; height: 3px; border-radius: 3px; background: #C15F3C; }
.app-body { position: absolute; left: 0; right: 0; top: 58px; bottom: 0; padding: 28px 34px; }
.serif { font-family: var(--f-en); }
.r-grid { display: grid; grid-template-columns: 1.25fr 1fr; gap: 30px; height: 100%; }
.r-pass { background: #FFFDF8; border-radius: 14px; padding: 24px 28px; box-shadow: 0 1px 2px rgba(34,32,28,.08), 0 8px 24px rgba(34,32,28,.06); }
.r-pass .k { font-size: 12px; letter-spacing: .18em; color: #8A8276; }
.r-pass h4 { margin: 8px 0 12px; font: 600 28px var(--f-en); }
.r-pass p { margin: 0 0 10px; font: 400 17.5px/1.62 var(--f-en); color: #2A2722; }
.hl { background: linear-gradient(rgba(232,116,63,.34), rgba(232,116,63,.34)) no-repeat 0 75% / 0% 60%; }
.r-q { display: grid; gap: 14px; align-content: start; }
.q { background: #FFFDF8; border-radius: 12px; padding: 14px 18px; box-shadow: 0 1px 2px rgba(34,32,28,.08); }
.q .n { font-size: 12px; font-weight: 700; color: #8A8276; letter-spacing: .1em; }
.q .s { margin: 4px 0 10px; font: 400 16.5px/1.45 var(--f-en); }
.q .o { display: flex; gap: 8px; }
.q .o span { font-size: 12px; font-weight: 700; padding: 5px 11px; border-radius: 999px; border: 1.5px solid rgba(34,32,28,.22); }
.q .o .bad { background: #D2452F; border-color: #D2452F; color: #fff; }
.q .o .good { background: #22A660; border-color: #22A660; color: #fff; }
.coachp { background: #22201C; color: #F4F1EA; border-radius: 14px; padding: 16px 18px; font-size: 15px; line-height: 1.6; }
.coachp b { color: #F6A47E; }
.w-grid { display: grid; grid-template-columns: 1.45fr 1fr; gap: 30px; height: 100%; }
.w-essay { background: #FFFDF8; border-radius: 14px; padding: 24px 30px; box-shadow: 0 1px 2px rgba(34,32,28,.08), 0 8px 24px rgba(34,32,28,.06); font: 400 19px/2 var(--f-en); color: #2A2722; }
.w-essay .k { font: 500 12px var(--f-sans); letter-spacing: .18em; color: #8A8276; }
.uw { text-decoration: underline wavy #D2452F; text-decoration-thickness: 1.5px; text-underline-offset: 5px; }
.w-score { background: #FFFDF8; border-radius: 14px; padding: 24px; box-shadow: 0 1px 2px rgba(34,32,28,.08); display: grid; gap: 14px; align-content: start; }
.w-score .big { font: 900 92px/1 var(--f-sans); letter-spacing: -.03em; }
.bar { display: grid; grid-template-columns: 92px 1fr 36px; gap: 10px; align-items: center; font-size: 14px; }
.bar i { display: block; height: 10px; border-radius: 6px; background: rgba(34,32,28,.08); overflow: hidden; }
.bar i::after { content: ""; display: block; height: 100%; width: var(--w); background: var(--c); border-radius: 6px; }
.nb-h { font: 900 34px var(--f-serif); margin: 0 0 14px; }
.nb-row { display: flex; gap: 22px; margin-bottom: 26px; }
.nb-card { flex: 1; min-width: 0; border: 2.5px solid #1E1A16; box-shadow: 4px 4px 0 #1E1A16; border-radius: 14px; padding: 14px 16px; background: #FFF8EA; color: #1E1A16; transform: rotate(var(--r, 0deg)); }
.nb-card small { font-size: 12px; font-weight: 700; letter-spacing: .1em; opacity: .7; }
.nb-card p { margin: 6px 0 0; font-weight: 700; font-size: 16px; line-height: 1.45; }
.nb-card .msc { width: 40px; height: 40px; float: right; margin: -4px -4px 0 6px; }
.ov-hi { font: 900 44px var(--f-serif); margin: 6px 0 4px; }
.ov-tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin: 22px 0; }
.ov-tiles div { background: #FFFDF8; border-radius: 14px; padding: 18px; box-shadow: 0 1px 2px rgba(34,32,28,.08); }
.ov-tiles small { color: #8A8276; font-size: 13px; }
.ov-tiles b { display: block; font: 900 38px var(--f-sans); margin-top: 4px; letter-spacing: -.02em; }
.ov-cta { display: flex; justify-content: space-between; align-items: center; background: #22201C; color: #F4F1EA; border-radius: 16px; padding: 22px 26px; font-size: 18px; }
.ov-cta span { background: #C15F3C; padding: 10px 20px; border-radius: 999px; font-weight: 700; font-size: 15px; }

/* misc shot pieces */
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
.memcard { position: absolute; width: 760px; height: 420px; transform-style: preserve-3d; }
.memcard > div { position: absolute; inset: 0; border-radius: 36px; backface-visibility: hidden; padding: 48px 54px; display: flex; flex-direction: column; justify-content: space-between; border: 4px solid #1E1A16; box-shadow: 10px 10px 0 #1E1A16; color: #1E1A16; }
.memcard .tag { align-self: flex-start; font: 900 30px var(--f-sans); padding: 8px 22px; border-radius: 999px; background: #1E1A16; color: #FFF8EA; }
.memcard p { margin: 0; font: 900 54px/1.3 var(--f-sans); letter-spacing: -.01em; }
.memcard .ev { font: 700 26px var(--f-sans); opacity: .7; }
.lock-body { position: absolute; background: var(--ink); }
.keyhole { position: absolute; left: 50%; top: 50%; width: 30px; height: 64px; margin: -30px 0 0 -15px; }
.keyhole::before { content: ""; position: absolute; left: 0; top: 0; width: 30px; height: 30px; border-radius: 50%; background: var(--void); }
.keyhole::after { content: ""; position: absolute; left: 10px; top: 22px; width: 10px; height: 38px; border-radius: 5px; background: var(--void); }
.odo { display: flex; font-variant-numeric: tabular-nums; }
.odo .col { height: 1em; overflow: hidden; }
.odo .col span { display: block; height: 1em; }
.cloud { position: absolute; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,255,255,.95), rgba(255,255,255,.55) 55%, rgba(255,255,255,0)); filter: blur(6px); }

body.export { padding: 0; overflow: hidden; }
body.export .page > :not(.viewport) { display: none; }
body.export .page { max-width: none; }
body.export .viewport { position: fixed; inset: 0; width: 1920px; height: 1080px; border-radius: 0; box-shadow: none; aspect-ratio: auto; }
</style>

<div class="page">
  <div class="masthead">
    <h1>IELTS Atlas <span>·</span> TVC</h1>
    <p>68 秒 · 1920×1080 · 配乐 Welcome to The Future（0:49 起）</p>
  </div>
  <div class="viewport" id="viewport" role="img" aria-label="IELTS Atlas 广告片：笔记本样机展示阅读 Coach、写作评分、札记，色场剪影与特写镜头，结尾落版 IELTS Atlas。">
    <div id="stage"></div>
  </div>
  <div class="transport">
    <button class="btn" id="play" type="button" aria-label="播放"><svg viewBox="0 0 16 16" id="play-ico"><path d="M4 2l10 6-10 6z"/></svg></button>
    <button class="btn" id="replay" type="button" aria-label="从头播放"><svg viewBox="0 0 16 16"><path d="M8 2a6 6 0 1 1-5.6 3.9l1.9.7A4 4 0 1 0 8 4v2.5L4.5 3 8 0z"/></svg></button>
    <input type="range" id="scrub" min="0" max="68.07" step="0.01" value="0" aria-label="播放进度">
    <span class="time" id="time">00:00.0 / 01:08.1</span>
    <button class="btn fs" id="fs" type="button">全屏</button>
  </div>
  <div class="sound">
    <label class="btn" for="song"><svg viewBox="0 0 16 16"><path d="M6 2v8.3A2.5 2.5 0 1 0 7.5 12.5V5h5V2z"/></svg>载入配乐</label>
    <input type="file" id="song" accept="audio/*">
    <p id="sound-note">选择你本机的 <b>Welcome to The Future.mp3</b>，画面会从歌曲 0:49 起同步播放。音乐只在你的浏览器里读取，不会上传。</p>
  </div>
  <section class="notes">
    <h2>镜头表</h2>
    <p class="lede">每个镜头的切点都落在节拍上（约 123 BPM）。点任意一行跳到该镜头。</p>
    <ol class="shots" id="shots"></ol>
  </section>
</div>

<script>
(() => {
  'use strict';
  // The song is cut in at 0:49 ("Welcome to yeah"); the main act starts on 0:58.57 ("Take a look at the light").
  // Main-act shots are timed in seconds after 0:58.57, so they sit O seconds into the film.
  const AUDIO_START = 49.0, O = 58.57 - AUDIO_START, MAIN = 58.5, DUR = MAIN + O;
  const C = { void: '#050505', ink: '#F4F1EA', ember: '#E8743F', paper: '#F4F1EA', nbInk: '#1E1A16',
    orange: '#FF6A1A', blue: '#1F6FE5', sky: '#2AA8F2', green: '#16A35A', purple: '#8E5BE0', yellow: '#FFC21A', pink: '#FF5FA2', red: '#F0412A', navy: '#0B1640' };
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const exportMode = /[?&]export\b/.test(location.search);

  /* ── math ── */
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, p) => a + (b - a) * p;
  const prog = (t, a, b) => clamp((t - a) / (b - a));
  const E = {
    inCubic: (p) => p * p * p,
    outCubic: (p) => 1 - Math.pow(1 - p, 3),
    inOutCubic: (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2),
    inOutQuart: (p) => (p < 0.5 ? 8 * p ** 4 : 1 - Math.pow(-2 * p + 2, 4) / 2),
    outExpo: (p) => (p >= 1 ? 1 : 1 - Math.pow(2, -10 * p)),
    inExpo: (p) => (p <= 0 ? 0 : Math.pow(2, 10 * p - 10)),
    inOutSine: (p) => -(Math.cos(Math.PI * p) - 1) / 2,
  };
  function spring(x, w = 12, z = 0.6) {
    if (x <= 0) return 0;
    if (z < 1) { const wd = w * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w * x) * (Math.cos(wd * x) + (z * w / wd) * Math.sin(wd * x)); }
    return 1 - (1 + w * x) * Math.exp(-w * x);
  }
  const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const mix = (a, b, p) => { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], clamp(p)))).join(',')})`; };
  function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let r = Math.imul(seed ^ (seed >>> 15), 1 | seed); r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r; return ((r ^ (r >>> 14)) >>> 0) / 4294967296; }; }
  // Beat grid measured from the track (seconds after the 0:58.57 cut-in).
  const BEATS = [0.01, 0.5, 1.01, 1.49, 1.98, 2.47, 2.96, 3.47, 3.95, 4.47, 4.93, 5.42, 5.93, 6.44, 6.93, 7.41, 7.93, 8.41, 8.9, 9.41, 9.9, 10.41, 10.9, 11.39, 11.87, 12.38, 12.87, 13.36, 13.87, 14.38, 14.87, 15.36, 15.84, 16.35, 16.84, 17.33, 17.84, 18.35, 18.84, 19.33, 19.81, 20.3, 20.79, 21.3, 21.81, 22.3, 23.43, 23.78, 24.25, 24.76, 25.27, 25.76, 26.25, 26.76, 27.24, 27.73, 28.24, 28.73, 29.24, 29.73, 30.22, 30.73, 31.22, 31.73, 32.21, 32.7, 33.19, 33.7, 34.19, 34.67, 35.19, 35.67, 36.18, 36.67, 37.16, 37.67, 38.16, 38.67, 39.16, 39.64, 40.13, 40.64, 41.15, 41.64, 42.13, 42.62, 43.13, 43.61, 44.08, 44.61, 45.1, 45.61, 46.1, 46.59, 47.1, 47.59, 48.03, 48.44, 48.93, 49.42, 49.91, 50.42, 50.91, 51.42, 51.9, 52.39, 52.88, 53.37, 53.88, 54.39, 54.92, 55.5, 56.01, 56.52, 57.01, 57.5, 58.01];
  // 1 right on a beat, decaying to 0 before the next one.
  const BEATS_INTRO = [0.16, 0.65, 1.16, 1.64, 2.15, 2.64, 3.13, 3.62, 4.11, 4.59, 5.1, 5.59, 6.1, 6.59, 7.1, 7.59, 8.08, 8.54, 9.07];
  function kickIntro(t, k = 7) { let b = -9; for (const x of BEATS_INTRO) { if (x <= t) b = x; else break; } return Math.exp(-(t - b) * k); }
  function kick(t, k = 7) { let b = -9; for (const x of BEATS) { if (x <= t) b = x; else break; } return Math.exp(-(t - b) * k); }

  /* ── text helpers ── */
  function split(el, mode = 'block') {
    const out = [];
    const walk = (node) => {
      [...node.childNodes].forEach((n) => {
        if (n.nodeType === 3) {
          const frag = document.createDocumentFragment();
          for (const c of n.textContent) {
            if (mode === 'block' && c === ' ') { frag.appendChild(document.createTextNode(' ')); continue; }
            const s = document.createElement('span'); s.className = mode === 'block' ? 'ch' : 'chi'; s.textContent = c; frag.appendChild(s); out.push(s);
          }
          n.replaceWith(frag);
        } else if (n.nodeType === 1 && !n.classList.contains('nosplit') && n.tagName !== 'BR' && n.tagName.toLowerCase() !== 'svg') walk(n);
      });
    };
    walk(el); return out;

    `<div class="app">${NAV('写作')}<div class="app-body"><div class="w-grid"><div class="w-essay"><div class="k">TASK 2 · 正在评分</div><span class="tw">${ESSAY}</span><span class="caret" style="display:inline-block;width:3px;height:1.1em;background:#C15F3C;vertical-align:-.15em;margin-left:2px"></span></div>

      <div style="height:12px;border-radius:6px;background:rgba(34,32,28,.08);overflow:hidden"><i class="pb" style="display:block;height:100%;width:0;background:#C15F3C;border-radius:6px"></i></div>
      ${['任务回应', '连贯与衔接', '词汇资源', '语法'].map((n) => `<div class="crit" style="display:flex;justify-content:space-between;font-size:15px;color:#69645B"><span>${n}</span><b style="color:#22201C">…</b></div>`).join('')}</div></div></div></div>`,
    SCR.notebook,
    SCR.reading,
    `<div class="app">${NAV('技能')}<div class="app-body" style="display:grid;grid-template-columns:1fr 1.2fr;align-items:center"><div><div style="font:900 40px var(--f-serif)">学习画像</div><div style="margin-top:10px;color:#69645B;font-size:17px;line-height:1.7">六项阅读技能，<br>随每次练习更新。</div><div style="margin-top:22px;font:900 30px var(--f-sans);color:#C15F3C">第 4 周</div></div>${miniRadar}</div></div>`,
    `<div class="app">${NAV('札记')}<div class="app-body"><div style="font:900 36px var(--f-serif);margin-bottom:18px">关于你，我们记住了</div>${[['偏好', '讲解时先给原文例句，再讲规则', '来自 6 次 Coach 反馈'], ['弱项', '判断题里，常把 FALSE 当成 NOT GIVEN', '证据 14 条'], ['进步', '同义替换正确率 54% → 71%', '近 4 周 · 38 次作答'], ['习惯', '晚上 9 点后练习，专注度最高', '来自 23 天记录']].map(([k, v, e], i) => `<div class="memrow" style="display:grid;grid-template-columns:76px 1fr auto;gap:16px;align-items:center;background:#FFFDF8;border-radius:14px;padding:16px 20px;margin-bottom:12px;box-shadow:0 1px 2px rgba(34,32,28,.08)"><span style="font-weight:700;font-size:14px;padding:5px 12px;border-radius:999px;background:${['#9CC3DE', '#E0643A', '#A8D5BA', '#E8B33A'][i]};color:#1E1A16;text-align:center">${k}</span><b style="font-size:19px">${v}</b><span style="color:#8A8276;font-size:14px">${e}</span></div>`).join('')}</div></div>`,
  ];
  shot('合影 · 功能', 49.42, 54.26, `<div class="fill" style="background:radial-gradient(ellipse at 50% 45%,#2A2018,#050505 70%)"></div><div class="lap-shadow" style="top:760px"></div>${laptopHTML(`<div class="views" style="position:absolute;inset:0">${VIEWS.map((v) => `<div class="view" style="position:absolute;inset:0">${v}</div>`).join('')}</div>`)}<div class="abs center-x feat" style="top:60px;height:90px;overflow:hidden"><div class="featroll">${FEAT.map((f) => `<div style="height:90px;font:900 64px/90px var(--f-sans)">${f}</div>`).join('')}</div></div>${['excited', 'joyful', 'energized', 'focused', 'calm'].map((k) => `<div class="abs hop" style="left:0;top:0;width:170px;height:170px">${msc(k)}</div>`).join('')}`,
    (el) => ({ hops: $$('.hop', el), views: $$('.view', el), tw: split($('.tw', el), 'inline'), caret: $('.caret', el), breath: $('.breath', el), pct: $('.pct', el), pb: $('.pb', el), crit: $$('.crit b', el), cards: $$('.view:nth-child(2) .nb-card', el), hl: $('.view:nth-child(3) .hl', el), mr: $('.mr', el), mem: $$('.memrow', el), featroll: $('.featroll', el), feat: $('.feat', el), dim: $('.dim', el) }),
    (lt, t, el, c) => {
      const push = E.inOutCubic(prog(t, 51.66, 53.95));
      const gather = E.inOutCubic(prog(t, 53.95, 54.26));
      cam(el, { z: lerp(-640, -300, push) + lerp(0, -100, E.inOutSine(prog(lt, 0, 2.2))), y: lerp(190, 240, push), rx: lerp(-10, -5, push), ry: lerp(-6, 0, prog(lt, 0, 2)), lid: 12, dim: gather });
      $('.lap', el).style.opacity = 1 - gather; $('.lap-shadow', el).style.opacity = 1 - gather;
      // screen carousel: a continuous index that springs forward on each hop
      let f = 0; HOP_BEATS.slice(1).forEach((b) => { f += spring(t - b, 13, 0.82); });
      c.views.forEach((v, i) => { v.style.transform = `translateX(${((i - f) * 100).toFixed(2)}%)`; v.style.visibility = Math.abs(i - f) < 1.01 ? 'visible' : 'hidden'; });
      // feature title rolls with the carousel
      let ff = 0; HOP_BEATS.forEach((b) => { ff += spring(t - b, 13, 0.82); });
      c.featroll.style.transform = `translateY(${-Math.max(0, ff - 1) * 90}px)`;
      c.feat.style.opacity = clamp(ff * 1.5) * (1 - gather);
      // 1 · writing: typewriter, breathing orb, progress bar, criteria fill in; result on the first hop
      const n = Math.floor(c.tw.length * prog(t, 49.6, 51.5));
      c.tw.forEach((s, i) => { s.style.opacity = i < n ? 1 : 0; });
      c.caret.style.opacity = Math.floor(t * 4) % 2 ? 0.15 : 1;
      const pr = prog(t, 49.7, 51.9);
      c.pb.style.width = `${(pr * 100).toFixed(1)}%`;
      const done = t >= 51.9, br = 1 + 0.08 * Math.sin(t * 6.3);
      c.breath.style.transform = `scale(${done ? lerp(br, 1.12, spring(t - 51.9, 14, 0.4)) : br})`;
      c.breath.style.opacity = done ? 1 : 0.75 + 0.25 * Math.sin(t * 6.3);
      c.pct.textContent = done ? '7.0' : `${Math.floor(pr * 100)}%`;
      c.pct.style.fontSize = done ? '76px' : '54px';
      ['7.0', '6.5', '7.0', '6.5'].forEach((v, i) => { c.crit[i].textContent = pr >= (i + 1) / 4.2 ? v : '…'; });
      // 2 · notebook cards drop in
      c.cards.forEach((cd, i) => { const s = spring(t - 52.45 - i * 0.04, 15, 0.55); cd.style.transform = `rotate(${[-1.5, 1, -0.5, 1, -1, 0.5, -1.5][i]}deg) translateY(${(1 - s) * -60}px)`; cd.style.opacity = clamp((t - 52.45 - i * 0.04) / 0.1); });
      // 3 · coach: evidence sweep
      c.hl.style.backgroundSize = `${E.inOutCubic(prog(t, 52.95, 53.3)) * 100}% 60%`;
      // 4 · learner radar grows
      const rg = spring(t - 53.42, 10, 0.55);
      c.mr.setAttribute('points', SK.map((_, k) => { const a = -Math.PI / 2 + k * Math.PI / 3, r = 210 * (0.08 + (W4[k] - 0.08) * rg); return `${(300 + Math.cos(a) * r).toFixed(1)},${(280 + Math.sin(a) * r).toFixed(1)}`; }).join(' '));
      // 5 · memory rows slide in
      c.mem.forEach((m, i) => { const s = spring(t - 53.92 - i * 0.05, 15, 0.7); m.style.transform = `translateX(${(1 - s) * 80}px)`; m.style.opacity = clamp((t - 53.92 - i * 0.05) / 0.1); });
      // mascots: line up, hop on their beat, then gather into one dot
      const sc = lerp(1, 1.25, push);
      c.hops.forEach((h, i) => {
        const s = spring(lt - 0.1 - i * 0.09, 11, 0.5);
        const hb = HOP_BEATS[i], hp = prog(t, hb, hb + 0.42), jump = Math.sin(Math.PI * hp);
        let x = 960 + (i - 2) * 220 * sc, y = lerp(860, 900, push) - jump * 160;
        x = lerp(x, 960, gather); y = lerp(y, 540, gather);
        const k = clamp(s, 0, 1.3) * sc * lerp(1, 0.24, gather);
        h.style.transform = `translate(${x - 85}px,${y - 85}px) scale(${k * (1 + 0.12 * jump)},${k * (1 - 0.06 * jump)})`;
        h.style.opacity = gather > 0.85 ? 1 - prog(gather, 0.85, 1) : 1;
      });
    }, '样机正面，五只小怪兽一字排开。每一声 welcome to 跳一只，屏幕滑到它负责的功能：写作评分（打字机、呼吸评分球、进度条）、札记、阅读 Coach、学习画像、长期记忆。最后五只合成一颗橙点。');

  /* 25 · end card on the last "Welcome to the future" */
  shot('落版', 54.26, MAIN + 0.01, `<div class="fill" style="background:${C.void}"></div><div class="abs center-x wm" style="top:330px;font:600 210px/1.1 var(--f-en);letter-spacing:-.03em;white-space:nowrap">IELTS Atlas<span class="nosplit dt" style="display:inline-block;width:.18em;height:.18em;margin-left:.04em;border-radius:50%;background:${C.ember}"></span></div><div class="abs center-x tg" style="top:640px;font-size:80px;font-weight:900">越练，越懂你。</div><div class="abs center-x ft" style="top:790px;font:500 30px var(--f-sans);color:var(--mute);letter-spacing:.06em">AI 写作评分 · 阅读 Coach · 自进化学习画像</div><div class="fill fo" style="background:#000"></div>`,
    (el) => ({ wm: split($('.wm', el)), dt: $('.dt', el), tg: split($('.tg', el)), ft: $('.ft', el), fo: $('.fo', el) }),
    (lt, t, el, c) => {
      rise(c.wm, lt, 0.05, { stagger: 0.045, dy: 0.5 });
      // the merged dot starts at the centre and lands as the full stop
      c.dt.style.transform = 'none';
      const r = c.dt.getBoundingClientRect(), sr = stage.getBoundingClientRect(), k = sr.width / 1920 || 1;
      const hx = (r.left - sr.left + r.width / 2) / k, hy = (r.top - sr.top + r.height / 2) / k;
      const d = spring(lt - 0.15, 9.5, 0.62);
      const arc = Math.sin(Math.PI * clamp(d)) * 160;
      c.dt.style.transform = `translate(${(1 - d) * (960 - hx)}px,${(1 - d) * (540 - hy) - arc}px) scale(${lerp(40 / r.height * k, 1, clamp(d, 0, 1.2))})`;
      rise(c.tg, lt, 0.95, { stagger: 0.06, dy: 0.5 });
      c.ft.style.opacity = prog(lt, 1.6, 2.0);
      c.fo.style.opacity = prog(t, MAIN - 0.8, MAIN);
    }, '黑场落版：IELTS Atlas，橙点落成句号，越练，越懂你。<em>Welcome to the future</em>');

  // split() with a per-element cache, for text that is split lazily inside draw().
  split.cache = (el) => el._chars || (el._chars = split(el));

  function render(t) {
    t = clamp(t, 0, DUR);
    for (const s of SHOTS) {
      const on = t >= s.a && t < s.b;
      s.el.style.display = on ? 'block' : 'none';
      if (on) s.draw(t);
    }
  }

  /* ── player ── */
  const fmt = (s) => { const m = Math.floor(s / 60), r = s - m * 60; return `${String(m).padStart(2, '0')}:${r.toFixed(1).padStart(4, '0')}`; };
  const listed = SHOTS.filter((s) => s.note);
  $('#shots').innerHTML = listed.map((s, i) => `<li data-i="${i}" tabindex="0"><span class="tc">${fmt(s.a).slice(0, 5)}</span><div><strong>${s.name.replace(/ .*$/, '') === s.name ? s.name : s.name}</strong><span>${s.note}</span></div></li>`).join('');
  const rows = $$('#shots li');

  let T = 0, playing = false, last = null;
  const audio = new Audio(); let audioReady = false;
  const scrub = $('#scrub'), timeEl = $('#time'), playBtn = $('#play');
  function setPlaying(p) {
    playing = p; last = null;
    $('#play-ico').innerHTML = p ? '<path d="M4 2h3v12H4zM9 2h3v12H9z"/>' : '<path d="M4 2l10 6-10 6z"/>';
    playBtn.setAttribute('aria-label', p ? '暂停' : '播放');
    if (audioReady) {
      if (p) { try { audio.currentTime = AUDIO_START + T; } catch (_) {} audio.play().catch(() => {}); } else audio.pause();
    }
  }
  function seek(t) { T = clamp(t, 0, DUR); if (audioReady) { try { audio.currentTime = AUDIO_START + T; } catch (_) {} } last = null; }
  function syncUI() {
    scrub.value = T.toFixed(2); timeEl.textContent = `${fmt(T)} / ${fmt(DUR)}`;
    let cur = 0; listed.forEach((s, i) => { if (T >= s.a) cur = i; });
    rows.forEach((r, i) => r.setAttribute('aria-current', i === cur ? 'true' : 'false'));
  }
  function tick(now) {
    if (playing) {
      if (audioReady && !audio.paused) T = audio.currentTime - AUDIO_START;
      else { if (last != null) T += Math.min(0.1, (now - last) / 1000); last = now; }
      if (T >= DUR) { T = DUR; setPlaying(false); }
    }
    render(T); syncUI(); requestAnimationFrame(tick);
  }
  playBtn.addEventListener('click', () => { if (!playing && T >= DUR) seek(0); setPlaying(!playing); });
  $('#viewport').addEventListener('click', () => playBtn.click());
  $('#replay').addEventListener('click', () => { seek(0); setPlaying(true); });
  scrub.addEventListener('input', () => seek(parseFloat(scrub.value)));
  const jump = (li) => { seek(listed[+li.dataset.i].a + 0.001); setPlaying(true); };
  $('#shots').addEventListener('click', (e) => { const li = e.target.closest('li'); if (li) jump(li); });
  $('#shots').addEventListener('keydown', (e) => { const li = e.target.closest('li'); if (li && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); jump(li); } });
  $('#fs').addEventListener('click', () => { const v = $('#viewport'); try { (v.requestFullscreen ? v.requestFullscreen() : Promise.reject()).catch(() => {}); } catch (_) {} });
  $('#song').addEventListener('change', (e) => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    audio.src = URL.createObjectURL(f); audio.preload = 'auto';
    audio.addEventListener('loadedmetadata', () => {
      audioReady = true;
      $('#sound-note').innerHTML = `已载入 <b>${f.name.replace(/[<>&]/g, '')}</b>。按播放，画面与歌曲从 0:49 起同步。`;
      seek(0); setPlaying(true);
    }, { once: true });
  });
  document.addEventListener('keydown', (e) => { if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); playBtn.click(); } });

  const vp = $('#viewport');
  const fit = () => { stage.style.transform = `scale(${exportMode ? 1 : vp.clientWidth / 1920})`; };
  new ResizeObserver(fit).observe(vp); fit();

  const allText = stage.textContent + '0123456789.→%';
  const fontsReady = Promise.all([
    ['900 100px "Noto Sans SC"', allText], ['700 100px "Noto Sans SC"', allText], ['500 100px "Noto Sans SC"', allText],
    ['900 100px "Noto Serif SC"', allText], ['600 100px "Newsreader"', allText], ['400 100px "Newsreader"', allText],
    ['italic 500 100px "Newsreader"', allText], ['italic 400 100px "Newsreader"', allText],
  ].map(([f, s]) => document.fonts.load(f, s))).catch(() => {}).then(() => document.fonts.ready);

  if (exportMode) {
    document.body.classList.add('export');
    window.__atlasFilm = { duration: DUR, audioStart: AUDIO_START, ready: fontsReady.then(fit), render };
    render(0); return;
  }
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  // Open on a representative frame; playback waits for the viewer (and, ideally, the soundtrack).
  T = reduce ? DUR - 3 : 18.5; render(T); syncUI();
  fontsReady.then(() => requestAnimationFrame(tick));
})();
</script>
